# ===== Aplicacion =====
spring.application.name=portal-creditos-backend
server.port=8080

# Activa el perfil "local", que carga application-local.properties (credenciales y secretos)
spring.profiles.active=local

# ===== Base de datos MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/portal_creditos?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Seguridad / JWT =====
# El secreto para firmar los tokens (app.jwt.secreto) va en application-local.properties
app.jwt.emisor=portal-creditos
app.jwt.expiracion-minutos=60
app.seguridad.max-intentos-fallidos=5

# ===== CORS: origen del frontend Angular =====
# Se permite localhost y equipos de la red local (celular en el mismo WiFi)
app.cors.origenes-permitidos=http://localhost:4200,http://192.168.*.*:4200,http://10.*.*.*:4200,http://172.*.*.*:4200

# ===== Fechas de negocio =====
# TIEMPO REAL: vacio = la aplicacion usa la fecha y hora reales del computador (zona America/Bogota).
# Los datos ficticios se calculan relativos al dia en que se cargan (ver database/02_datos_ficticios.sql).
# Solo para pruebas se puede fijar una fecha, por ejemplo app.fecha-sistema=2026-10-17
app.fecha-sistema=
# Dias antes del vencimiento en que el semaforo pasa a "proxima a vencer"
app.dias-alerta-vencimiento=5
# Mora: valor fijo por cada dia de atraso mientras el credito tenga cuotas vencidas (una vez por credito)
app.mora.valor-dia=380
# Levantamiento de prenda: costo del tramite, vigencia del documento y cuenta EXCLUSIVA de recaudo
# (el pago es simulado; en produccion se usaria un convenio de recaudo autorizado)
app.levantamiento.costo=30000
app.levantamiento.vigencia-dias=30
app.levantamiento.cuenta-recaudo=7854

# ===== Archivos (importacion Excel/CSV) =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.importacion.max-filas=1000
# Contrasena inicial de los clientes importados (deben cambiarla en el primer ingreso)
app.importacion.password-inicial=Temporal2026*

# ===== Documentos =====
# Direccion del frontend: el QR del paz y salvo apunta a la pagina publica de verificacion
app.frontend-url=http://localhost:4200
# Nombre que aparece en los documentos generados (prototipo: no usar como documento real)
app.documentos.entidad=Entidad financiera de ejemplo
# Formato del paz y salvo de Rentar Inversiones
app.documentos.razon-social=RENTAR INVERSIONES LTDA
app.documentos.nit=813.007.547-8
app.documentos.ciudad-firma=Neiva
app.documentos.elaboro=Cristian Sarmiento
# Firma escaneada (PNG con fondo transparente). Va en backend/firma/firma.png y NO se sube a GitHub.
app.documentos.firma=firma/firma.png
# Pie del documento; cada "|" es un salto de linea
app.documentos.pie=Carrera 5 n 15-01 oficina 201 Tel\u00e9fono fijo: 8718316 celular: 3108898007-|3102066474 correo: rentarinversiones11@gmail.com|rentarinversionescartera@gmail.com
# Paz y salvo: marca de agua "DOCUMENTO DE PRUEBA" (false = formato limpio como el oficial) y QR pequeno de verificacion
app.documentos.paz-y-salvo.marca-de-agua=false
app.documentos.paz-y-salvo.qr=true
# Linea de atencion que aparece en los mensajes a clientes
app.contacto.linea-atencion=310 206 6474

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
