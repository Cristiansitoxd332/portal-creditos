# ===== Aplicacion =====
spring.application.name=portal-creditos-backend
server.port=8080

# Activa el perfil "local", que carga application-local.properties (credenciales y secretos)
spring.profiles.active=local

# ===== Base de datos MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/portal_creditos?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Seguridad / JWT =====
# El secreto para firmar los tokens (app.jwt.secreto) va en application-local.properties
app.jwt.emisor=portal-creditos
app.jwt.expiracion-minutos=60
app.seguridad.max-intentos-fallidos=5

# ===== CORS: origen del frontend Angular =====
app.cors.origenes-permitidos=http://localhost:4200
